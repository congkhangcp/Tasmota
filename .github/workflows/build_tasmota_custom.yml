name: Build Tasmota Custom Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Prepare environment
        run: |
          echo ">>> Preparing custom Tasmota build environment"
          mkdir -p ./tasmota/custom
          cp ./tasmota/my_user_config.h ./tasmota/custom/ || true
          cp ./user_config_override.h ./tasmota/ || true

      - name: Build custom firmware
        working-directory: ./tasmota
        run: |
          echo ">>> Starting custom build..."
          platformio run -e tasmota  # or -e tasmota_4M if using 4M build
          ls -lh .pio/build/tasmota/ || true

      - name: Rename and upload firmware
        if: success()
        run: |
          mkdir -p ./build_output
          cp ./tasmota/.pio/build/tasmota/firmware.bin ./build_output/tasmota_custom.bin
        continue-on-error: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota_custom_firmware
          path: ./build_output/tasmota_custom.bin
