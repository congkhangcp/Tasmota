name: Build Tasmota Custom Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Verify Tasmota structure
        run: |
          echo "Root folder content:"
          ls -lh
          echo "Tasmota subfolder content:"
          ls -lh ./tasmota || true

      - name: Copy override config
        run: |
          echo ">>> Copying user_config_override.h"
          cp ./user_config_override.h ./ || true
          echo ">>> Done"

      - name: Build custom firmware
        run: |
          echo ">>> Starting Tasmota custom build..."
          platformio run -e tasmota  # build default
          echo ">>> Build complete!"
          ls -lh .pio/build/tasmota/

      - name: Rename and upload firmware
        if: success()
        run: |
          mkdir -p ./build_output
          cp .pio/build/tasmota/firmware.bin ./build_output/tasmota_custom.bin
        continue-on-error: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota_custom_firmware
          path: ./build_output/tasmota_custom.bin
